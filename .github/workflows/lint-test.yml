name: Lint & test

# Keeps the shape from rotting: ruff (format + lint), mypy and the test suite
# run on every push/PR. Style conventions live in docs/STYLE.md and pyproject.toml.
on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cached hnswlib builds must work across runners with different CPUs.
env:
  HNSWLIB_NO_NATIVE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-suffix: hnswlib-portable-v1
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts bench
      - run: uv run ruff format --check src tests scripts bench

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-suffix: hnswlib-portable-v1
      - run: uv sync --locked
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-suffix: hnswlib-portable-v1
      - run: uv sync --locked
      - run: uv run pytest -q

  # The browser apps are built from frontend/ into src/mycelium/webui/, which is
  # committed so the Python package runs without Node. Rebuilding must reproduce
  # it exactly, or the committed bundles are stale.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Committed build output matches the sources
        run: |
          git add --intent-to-add ../src/mycelium/webui
          git diff --exit-code --stat -- ../src/mycelium/webui \
            || { echo "::error::src/mycelium/webui is stale. Run 'npm run build' in frontend/ and commit the result."; exit 1; }
